name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # AnvilMCP runs inside Linux dev containers and is built/operated
          # on the developer's macOS workstation. Windows is not a supported
          # target — the policy file ownership check uses POSIX-only
          # syscall.Stat_t and won't compile under GOOS=windows.
          - os: linux
            arch: amd64
            goarch: amd64
            file_ext: ''
          - os: linux
            arch: arm64
            goarch: arm64
            file_ext: ''
          - os: linux
            arch: arm
            goarch: arm
            file_ext: ''
          - os: darwin
            arch: amd64
            goarch: amd64
            file_ext: ''
          - os: darwin
            arch: arm64
            goarch: arm64
            file_ext: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'
          cache: true

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="v0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -ldflags="-X main.Version=${{ steps.version.outputs.version }}" \
            -o "dist/anvilmcp-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.file_ext }}" \
            ./cmd/anvilmcp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anvilmcp-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -name 'anvilmcp*' -exec mv {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum anvilmcp* > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          # Treat any tag with a SemVer pre-release suffix (-alpha, -beta, -rc.N,
          # etc.) as a prerelease so it doesn't get marked "Latest" on GitHub.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

